name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: joinly
          POSTGRES_PASSWORD: joinly
          POSTGRES_DB: joinly_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U joinly" --health-interval 2s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://joinly:joinly@localhost:5432/joinly_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: API reference is up to date
        run: pnpm docs:api && git diff --exit-code docs/api.md

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
